<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Game</h1>
    <h3>Press any key to start game</h3>
    <div class="par">
        <div class="child cls1 blue" type="button" id="blue"></div>
        <div class="child cls2 yellow" type="button" id="yellow"></div>
        <div class="child cls3 brown" type="button" id="brown"></div>
        <div class="child cls4 white" type="button" id="white"></div>
    </div>
    <script src="scriptt.js"></script>
</body>
</html>
